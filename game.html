<!DOCTYPE html>
<html>
  
  <link rel="stylesheet" href="gameStyles.css" />

  
  <form action="index.html" class="menu-form">
    <button type="submit" class="menu-button">  
      <img src="https://uploads.onecompiler.io/44p8ejdqq/44p8e5tdq/return.png" alt="menu"/>
    </button>
  </form>
  
  <form class="fullscreen">
    <button type="submit" class="menu-button" onclick="goFullscreen()">
      <img src="https://uploads.onecompiler.io/44p8ejdqq/44p8e5tdq/fullscreen.png" alt="menu"/>
    </button>
  </form>
  
  
  
  <body>
    <div class="game-container">
      <div class="score-board">
        <div id="leftScore">0</div>
        <div id="rightScore">0</div>
      </div>
      <div class="ball" id="ball"></div>\
      <div class="player left-player" id="leftPlayer"></div>
      <div class="player right-player" id="rightPlayer"></div>
      <div class="winner-message" id="winnerMessage"></div>
    </div>
    <button id"restartButton">Restart</button>
    <script src="script.js"></script>
  </body>



</html>
